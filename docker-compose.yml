x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://pulsequeue:pulsequeue@postgres:5432/pulsequeue
  # Optional accelerator (wake-ups + stats cache) and, since Milestone 6, the
  # home of the enqueue rate limiter's token buckets. Every process keeps
  # working if Redis goes away: /ready turns "degraded", workers fall back to
  # polling, and enqueues skip rate limiting (RATE_LIMIT_FAIL_MODE=open).
  REDIS_URL: redis://redis:6379
  REDIS_KEY_PREFIX: pq
  # Milestone 7: every process (API, worker, scheduler) serves Prometheus
  # metrics on its own listener, never on the public API port. Bound to all
  # interfaces inside the compose network (Prometheus scrapes it) but not
  # published to the host, and protected by a bearer token: production
  # refuses to start with a non-loopback METRICS_HOST and no token.
  METRICS_PORT: 9464
  METRICS_HOST: 0.0.0.0
  METRICS_TOKEN: ${METRICS_TOKEN:-pulsequeue-dev-metrics-token}
  # OpenTelemetry traces over OTLP/HTTP to Jaeger (UI on :16686). Off by
  # default outside this stack; one trace spans HTTP request -> enqueue ->
  # every execution attempt via jobs.traceparent.
  TRACING_ENABLED: ${TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_TRACES_SAMPLER_RATIO: ${OTEL_TRACES_SAMPLER_RATIO:-1}

services:
  # One-shot schema migration. Runs to completion before the API starts, so
  # the API never serves traffic against an old schema. The runner holds an
  # advisory lock, so a second concurrent run (e.g. scaled replicas) just waits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsequeue:local
    command: ['node', 'dist/db/migrate-cli.js']
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsequeue:local
    ports:
      - '${PORT:-3000}:3000'
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3000
      # Milestone 6: every request except /health and /ready needs an API key.
      # Bootstrap the first admin key with the CLI (the token is shown once):
      #   docker compose run --rm app node dist/cli/api-key.js create \
      #     --tenant acme --role admin --name bootstrap --create-tenant
      AUTH_CACHE_TTL_MS: 5000
      # Default per-tenant enqueue budget; per-tenant overrides via the CLI
      # (tenant-rate-limit), per-queue limits via PUT /queues/:name/settings.
      RATE_LIMIT_ENABLED: 'true'
      RATE_LIMIT_TENANT_PER_SEC: 100
      RATE_LIMIT_TENANT_BURST: 200
      RATE_LIMIT_FAIL_MODE: open
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Job workers: same image, different command. Scale horizontally with
  # `docker compose up --scale worker=3`; FOR UPDATE SKIP LOCKED lets replicas
  # share the queue without coordination, and every replica runs a reaper.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsequeue:local
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: 10
      WORKER_LEASE_DURATION_MS: 30000
      WORKER_HEARTBEAT_INTERVAL_MS: 10000
      WORKER_SHUTDOWN_TIMEOUT_MS: 25000
      WORKER_LIVENESS_FILE: /tmp/pulsequeue-worker.alive
      # Subscribed to wake-ups, the idle poll is only a safety net.
      WORKER_WAKEUP_FALLBACK_POLL_MS: 30000
    # Longer than WORKER_SHUTDOWN_TIMEOUT_MS so in-flight jobs can drain
    # before Docker escalates SIGTERM to SIGKILL (default is only 10s).
    stop_grace_period: 40s
    healthcheck:
      # The worker serves no HTTP; healthy = its loop touched the file recently.
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s=require('fs').statSync('/tmp/pulsequeue-worker.alive');process.exit(Date.now()-s.mtimeMs<60000?0:1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # Started first so the first wake-up is not missed, but not required:
      # without Redis the process polls and logs redis.error until it is back.
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Cron scheduler: turns due schedules into jobs. Run 2 replicas for HA:
  # they elect a leader through a Postgres advisory lock, only the leader
  # ticks, and a standby takes over within SCHEDULER_LEADER_RETRY_INTERVAL_MS
  # if the leader dies. More than 2 adds nothing but idle standbys.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsequeue:local
    command: ['node', 'dist/scheduler.js']
    environment:
      <<: *app-env
      PG_POOL_MAX: 4
      SCHEDULER_TICK_INTERVAL_MS: 1000
      SCHEDULER_LEADER_RETRY_INTERVAL_MS: 5000
      SCHEDULER_MISFIRE_GRACE_MS: 60000
      SCHEDULER_MAX_CATCH_UP: 10
      SCHEDULER_SHUTDOWN_TIMEOUT_MS: 10000
      SCHEDULER_LIVENESS_FILE: /tmp/pulsequeue-scheduler.alive
    deploy:
      replicas: 2
    # Longer than SCHEDULER_SHUTDOWN_TIMEOUT_MS so the leader can finish its
    # tick and release the lock before SIGKILL.
    stop_grace_period: 20s
    healthcheck:
      # Leader and standby both touch the file from their loop.
      test:
        [
          'CMD',
          'node',
          '-e',
          "const s=require('fs').statSync('/tmp/pulsequeue-scheduler.alive');process.exit(Date.now()-s.mtimeMs<60000?0:1)",
        ]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # Started first so the first wake-up is not missed, but not required:
      # without Redis the process polls and logs redis.error until it is back.
      redis:
        condition: service_healthy
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsequeue
      POSTGRES_PASSWORD: pulsequeue
      POSTGRES_DB: pulsequeue
    ports:
      - '5432:5432'
    volumes:
      - pulsequeue_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsequeue -d pulsequeue']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Holds only derived, disposable state (wake-up pub/sub, stats cache, dirty
  # flags, rate-limit buckets), so no persistence is needed; Postgres is the
  # source of truth. Losing a bucket (restart or LRU eviction) just refills it.
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Observability (Milestone 7) -----------------------------------------
  # Prometheus scrapes app, worker and scheduler (replicas discovered through
  # Docker DNS); Grafana ships with both datasources and the PulseQueue
  # dashboard provisioned; Jaeger receives OTLP traces. None of the app
  # services depend on them: metrics and traces are best-effort, jobs are not.
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pulsequeue_prometheus:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # Local dev only: read-only anonymous access, admin login for edits.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pulsequeue-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP/HTTP (spans from app, worker)
    restart: unless-stopped

volumes:
  pulsequeue_pg:
  pulsequeue_prometheus:
