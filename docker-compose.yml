x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://pulsequeue:pulsequeue@postgres:5432/pulsequeue
  REDIS_URL: redis://redis:6379

services:
  # One-shot schema migration. Runs to completion before the API starts, so
  # the API never serves traffic against an old schema. The runner holds an
  # advisory lock, so a second concurrent run (e.g. scaled replicas) just waits.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsequeue:local
    command: ['node', 'dist/db/migrate-cli.js']
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulsequeue:local
    ports:
      - '${PORT:-3000}:3000'
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulsequeue
      POSTGRES_PASSWORD: pulsequeue
      POSTGRES_DB: pulsequeue
    ports:
      - '5432:5432'
    volumes:
      - pulsequeue_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulsequeue -d pulsequeue']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - pulsequeue_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pulsequeue_pg:
  pulsequeue_redis:
