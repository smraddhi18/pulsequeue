name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsequeue
          POSTGRES_PASSWORD: pulsequeue
          POSTGRES_DB: pulsequeue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsequeue -d pulsequeue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Milestone 5: wake-ups and the stats cache are tested against a real Redis.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue
      TEST_DATABASE_URL: postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Exercises the compiled migration CLI exactly as the Docker image runs it,
      # against a clean Postgres 16; running it twice proves it is idempotent.
      - name: Run migrations
        run: |
          npm run migrate
          npm run migrate

      # Boots the compiled worker exactly as the Docker image runs it, then sends
      # SIGTERM: it must drain and exit 0 (graceful-shutdown wiring). With
      # REDIS_URL set it must also subscribe to wake-ups.
      - name: Worker smoke test (start, subscribe, SIGTERM, clean exit)
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          node dist/worker.js > worker.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          cat worker.log
          grep -q '"event":"wakeup.subscribed"' worker.log

      # Boots the compiled scheduler: it must win the leader lock, then on
      # SIGTERM release it and exit 0.
      - name: Scheduler smoke test (start, lead, SIGTERM, clean exit)
        run: |
          node dist/scheduler.js > scheduler.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          cat scheduler.log
          grep -q '"event":"scheduler.leader_acquired"' scheduler.log
          grep -q '"event":"scheduler.leader_released"' scheduler.log

      # Unit tests plus integration tests (each suite migrates its own schema).
      - name: Test
        run: npm test
