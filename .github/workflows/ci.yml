name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsequeue
          POSTGRES_PASSWORD: pulsequeue
          POSTGRES_DB: pulsequeue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsequeue -d pulsequeue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Milestone 5: wake-ups and the stats cache are tested against a real Redis.
      # Milestone 6: so are the enqueue rate limiter's token buckets.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue
      TEST_DATABASE_URL: postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Exercises the compiled migration CLI exactly as the Docker image runs it,
      # against a clean Postgres 16; running it twice proves it is idempotent.
      - name: Run migrations
        run: |
          npm run migrate
          npm run migrate

      # Boots the compiled worker exactly as the Docker image runs it, then sends
      # SIGTERM: it must drain and exit 0 (graceful-shutdown wiring). With
      # REDIS_URL set it must also subscribe to wake-ups.
      - name: Worker smoke test (start, subscribe, SIGTERM, clean exit)
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          node dist/worker.js > worker.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          cat worker.log
          grep -q '"event":"wakeup.subscribed"' worker.log

      # Boots the compiled scheduler: it must win the leader lock, then on
      # SIGTERM release it and exit 0.
      - name: Scheduler smoke test (start, lead, SIGTERM, clean exit)
        run: |
          node dist/scheduler.js > scheduler.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          cat scheduler.log
          grep -q '"event":"scheduler.leader_acquired"' scheduler.log
          grep -q '"event":"scheduler.leader_released"' scheduler.log

      # Milestone 6: the API requires keys. Bootstraps the first admin key with
      # the compiled CLI (as an operator would), boots the compiled API, and
      # checks public probes, 401 without a key, and the enqueue rate limit
      # (burst 2: two 201s with RateLimit-* headers, then 429 + Retry-After).
      - name: API smoke test (CLI key bootstrap, auth, rate limit)
        env:
          NODE_ENV: production
          REDIS_URL: redis://localhost:6379
          PORT: 3100
          RATE_LIMIT_TENANT_PER_SEC: 1
          RATE_LIMIT_TENANT_BURST: 2
        run: |
          token=$(npm run --silent api-key -- create --tenant ci --role admin --name ci-smoke --create-tenant | jq -r .token)
          node dist/server.js > api.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf localhost:3100/health > /dev/null && break; sleep 0.5; done
          curl -sf localhost:3100/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3100/queues/smoke/jobs)" = 401
          enqueue() {
            curl -s -o /dev/null -D - -w '%{http_code}\n' -X POST localhost:3100/queues/smoke/jobs \
              -H "authorization: Bearer $token" -H 'content-type: application/json' -d '{"payload":{}}'
          }
          enqueue | tee r1.txt; grep -qi '^ratelimit-remaining: 1' r1.txt; tail -n1 r1.txt | grep -q 201
          enqueue | tee r2.txt; tail -n1 r2.txt | grep -q 201
          enqueue | tee r3.txt; grep -qi '^retry-after: 1' r3.txt; tail -n1 r3.txt | grep -q 429
          kill -TERM "$pid"
          wait "$pid"
          cat api.log

      # Unit tests plus integration tests (each suite migrates its own schema).
      - name: Test
        run: npm test
