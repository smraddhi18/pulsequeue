name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulsequeue
          POSTGRES_PASSWORD: pulsequeue
          POSTGRES_DB: pulsequeue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsequeue -d pulsequeue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Milestone 5: wake-ups and the stats cache are tested against a real Redis.
      # Milestone 6: so are the enqueue rate limiter's token buckets.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue
      TEST_DATABASE_URL: postgres://pulsequeue:pulsequeue@localhost:5432/pulsequeue
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Exercises the compiled migration CLI exactly as the Docker image runs it,
      # against a clean Postgres 16; running it twice proves it is idempotent.
      - name: Run migrations
        run: |
          npm run migrate
          npm run migrate

      # Boots the compiled worker exactly as the Docker image runs it, then sends
      # SIGTERM: it must drain and exit 0 (graceful-shutdown wiring). With
      # REDIS_URL set it must also subscribe to wake-ups.
      - name: Worker smoke test (start, subscribe, SIGTERM, clean exit)
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          node dist/worker.js > worker.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          cat worker.log
          grep -q '"event":"wakeup.subscribed"' worker.log

      # Boots the compiled scheduler: it must win the leader lock, then on
      # SIGTERM release it and exit 0.
      - name: Scheduler smoke test (start, lead, SIGTERM, clean exit)
        run: |
          node dist/scheduler.js > scheduler.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          kill -TERM "$pid"
          wait "$pid"
          cat scheduler.log
          grep -q '"event":"scheduler.leader_acquired"' scheduler.log
          grep -q '"event":"scheduler.leader_released"' scheduler.log

      # Milestone 6: the API requires keys. Bootstraps the first admin key with
      # the compiled CLI (as an operator would), boots the compiled API, and
      # checks public probes, 401 without a key, and the enqueue rate limit
      # (burst 2: two 201s with RateLimit-* headers, then 429 + Retry-After).
      - name: API smoke test (CLI key bootstrap, auth, rate limit)
        env:
          NODE_ENV: production
          REDIS_URL: redis://localhost:6379
          PORT: 3100
          RATE_LIMIT_TENANT_PER_SEC: 1
          RATE_LIMIT_TENANT_BURST: 2
        run: |
          token=$(npm run --silent api-key -- create --tenant ci --role admin --name ci-smoke --create-tenant | jq -r .token)
          node dist/server.js > api.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf localhost:3100/health > /dev/null && break; sleep 0.5; done
          curl -sf localhost:3100/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3100/queues/smoke/jobs)" = 401
          enqueue() {
            curl -s -o /dev/null -D - -w '%{http_code}\n' -X POST localhost:3100/queues/smoke/jobs \
              -H "authorization: Bearer $token" -H 'content-type: application/json' -d '{"payload":{}}'
          }
          enqueue | tee r1.txt; grep -qi '^ratelimit-remaining: 1' r1.txt; tail -n1 r1.txt | grep -q 201
          enqueue | tee r2.txt; tail -n1 r2.txt | grep -q 201
          enqueue | tee r3.txt; grep -qi '^retry-after: 1' r3.txt; tail -n1 r3.txt | grep -q 429
          kill -TERM "$pid"
          wait "$pid"
          cat api.log

      # Milestone 7: the compiled API and worker each serve Prometheus metrics
      # on their own listener. Checks: 401 without the bearer token, 200 with
      # it (HTTP histogram labelled by route template, enqueue counter, queue
      # depth from Postgres), and that the public API port does NOT serve
      # /metrics (deny-by-default stays intact).
      - name: Metrics smoke test (/metrics access and content)
        env:
          NODE_ENV: production
          PORT: 3200
          METRICS_HOST: 127.0.0.1
          METRICS_TOKEN: ci-metrics-token-0123456789
          RATE_LIMIT_ENABLED: 'false'
        run: |
          token=$(npm run --silent api-key -- create --tenant ci-metrics --role admin --name ci-metrics --create-tenant | jq -r .token)
          METRICS_PORT=9464 node dist/server.js > api-metrics.log 2>&1 &
          api=$!
          METRICS_PORT=9465 WORKER_QUEUES=echo node dist/worker.js > worker-metrics.log 2>&1 &
          worker=$!
          for i in $(seq 1 30); do curl -sf localhost:3200/health > /dev/null && break; sleep 0.5; done
          curl -sf -X POST localhost:3200/queues/echo/jobs -H "authorization: Bearer $token" \
            -H 'content-type: application/json' -d '{"payload":{"hello":"metrics"}}'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:9464/metrics)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'authorization: Bearer wrong-token-0123456789' localhost:9464/metrics)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" localhost:3200/metrics)" = 404
          curl -sf -H "authorization: Bearer $METRICS_TOKEN" localhost:9464/metrics > api-metrics.txt
          grep -q 'pulsequeue_http_request_duration_seconds_bucket{.*route="/queues/:name/jobs"' api-metrics.txt
          grep -q 'pulsequeue_jobs_enqueued_total{.*queue="echo".*result="created"' api-metrics.txt
          grep -q 'pulsequeue_queue_depth{' api-metrics.txt
          for i in $(seq 1 20); do
            curl -sf -H "authorization: Bearer $METRICS_TOKEN" localhost:9465/metrics > worker-metrics.txt || true
            grep -q 'pulsequeue_jobs_completed_total{.*queue="echo"' worker-metrics.txt && break
            sleep 0.5
          done
          grep -q 'pulsequeue_jobs_completed_total{.*queue="echo"' worker-metrics.txt
          grep -q 'pulsequeue_job_queue_wait_seconds_bucket' worker-metrics.txt
          kill -TERM "$api" "$worker"
          wait "$api"
          wait "$worker"
          cat api-metrics.log worker-metrics.log

      # Milestone 8: 10 s of k6 traffic (5 VUs: enqueue with idempotency keys,
      # get, list, stats) against the compiled API plus one worker, started by
      # the same runner used for the real load tests. Thresholds: zero failed
      # requests, every check passes, p95 < 500 ms. A wiring check, not a
      # benchmark: shared CI runners are too noisy for capacity numbers.
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '2.3.0'

      - name: Load-test smoke (k6)
        env:
          REDIS_URL: redis://localhost:6379
          WORKERS: 1
          OUT_DIR: k6-smoke
        run: |
          bash loadtest/run-local.sh smoke.js -e DURATION=10s
          tail -n 20 k6-smoke/api.log

      # Unit tests plus integration tests (each suite migrates its own schema).
      - name: Test
        run: npm test
